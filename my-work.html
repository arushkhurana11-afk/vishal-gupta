<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Vishal Gupta</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .projects-container {
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            box-sizing: border-box;
        }
        .project-card {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 30px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 40px;
            overflow: hidden;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid var(--accent);
        }
        .project-thumb {
            width: 45%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .project-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
        }
        .project-title {
            font-family: var(--font-display);
            font-size: 2.2rem;
            margin: 0;
            color: #FFFFFF;
        }
        .project-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.6;
        }
        @media (max-width: 900px) {
            .project-card {
                flex-direction: column;
                gap: 25px;
            }
            .project-thumb {
                width: 100%;
                aspect-ratio: auto;
                height: 250px;
            }
        }
    </style>
</head>
<body>

    <div class="scroll-container">
        <div class="page-content">
            <nav class="pill-nav">
                <a href="index.html" class="nav-item">Home</a>
                <a href="about.html" class="nav-item">About</a>
                <a href="my-work.html" class="nav-item active">My Work</a>
                <a href="contact.html" class="nav-item">Contact</a>
            </nav>

            <main class="hero-card" style="align-items: flex-start; justify-content: flex-start;">
                <div class="projects-container">
                    <h1 style="font-family: var(--font-display); font-size: 3rem; margin: 0 0 10px 0; color: #FFFFFF;">My Work</h1>
                    <a href="https://mouse-tracker-zeta.vercel.app" target="_blank" class="project-card">
                        <img src="frames/mouse_tracker_thumb.png" alt="Mouse Tracker Thumbnail" class="project-thumb">
                        <div class="project-content">
                            <h2 class="project-title">Mouse Pointer Following Character homepage design.</h2>
                            <p class="project-desc">An interactive mouse tracking animation featuring a character whose eyes follow your cursor. Click to see this project.</p>
                        </div>
                    </a>
                </div>
            </main>

            <!-- Return to top removed -->
        </div>
    </div>

</body>
</html>
